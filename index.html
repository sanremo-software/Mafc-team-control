<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kassenbericht</title>

<style>
body {
  font-family: Arial;
  background:#eee;
  padding:20px;
}

.container {
  background:#fff;
  padding:20px;
  max-width:1100px;
  margin:auto;
  border:1px solid #000;
}

h1 {
  margin:0;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

td {
  border:1px solid #000;
  padding:5px;
  height:28px;
}

input {
  width:100%;
  border:none;
  outline:none;
}

.right {
  text-align:right;
}

.bold {
  font-weight:bold;
}

.red {
  color:red;
  font-weight:bold;
}

button {
  padding:10px;
  margin-bottom:10px;
  font-weight:bold;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<button onclick="window.print()">🖨️ Drucken</button>

<h1>Kassenbericht</h1>

<table>

<tr>
<td class="bold">Datum</td>
<td><input type="date" id="datum"></td>
<td class="bold right">Kassenbestand</td>
<td class="red right" id="kassenbestand">0.00 €</td>
</tr>

<tr>
<td colspan="4" class="bold">Ausgaben im Laufe des Tages</td>
</tr>

<tr>
<td>Wareneinkäufe</td>
<td><input type="number" id="waren" oninput="calc()"></td>
<td>Geschäftsausgaben</td>
<td><input type="number" id="geschaft" oninput="calc()"></td>
</tr>

<tr>
<td>Privatentnahmen</td>
<td><input type="number" id="privat" oninput="calc()"></td>
<td>Sonstige Ausgaben</td>
<td><input type="number" id="sonstige" oninput="calc()"></td>
</tr>

<tr>
<td colspan="3" class="bold right">Summe Ausgaben</td>
<td class="right" id="summeAusgaben">0.00 €</td>
</tr>

<tr>
<td class="bold">Kassenbestand Vortag</td>
<td><input type="number" id="vortag" oninput="calc()"></td>
<td class="bold">Sonstige Einnahmen</td>
<td><input type="number" id="einnahmenExtra" oninput="calc()"></td>
</tr>

<tr>
<td colspan="3" class="bold right">Kasseneingang</td>
<td class="red right" id="kasseEingang">0.00 €</td>
</tr>

<tr>
<td class="bold">TE 19%</td>
<td><input type="number" id="t19" oninput="check()"></td>
<td class="bold">TE 7%</td>
<td><input type="number" id="t7" oninput="check()"></td>
</tr>

<tr>
<td colspan="3" class="bold right">Total Kontrolle</td>
<td class="right" id="checkTotal">0.00 €</td>
</tr>

<tr>
<td class="bold">Kundenzahl</td>
<td><input type="number"></td>
<td class="bold">Betrag/Kunde</td>
<td></td>
</tr>

<tr>
<td colspan="4" style="height:60px;">Unterschrift</td>
</tr>

</table>

</div>

<script>

function val(id){
  return parseFloat(document.getElementById(id).value) || 0;
}

function calc(){

  let ausgaben =
    val("waren") +
    val("geschaft") +
    val("privat") +
    val("sonstige");

  document.getElementById("summeAusgaben").innerText =
    ausgaben.toFixed(2) + " €";

  let bestand =
    val("vortag") +
    val("einnahmenExtra") +
    ausgaben;

  document.getElementById("kassenbestand").innerText =
    bestand.toFixed(2) + " €";

  let eingang =
    bestand - val("vortag");

  document.getElementById("kasseEingang").innerText =
    eingang.toFixed(2) + " €";

  check();
}

function check(){

  let total = val("t19") + val("t7");

  document.getElementById("checkTotal").innerText =
    total.toFixed(2) + " €";

}

</script>

</body>
</html>
